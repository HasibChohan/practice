<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A memory</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--a:#120A1F;--b:#1D1030;--c:#321650;--d:#6D3B8F;--e:#A979C7;--pk:#ff8fb8;--pe:#ffb38a;--gd:#ffd98a;--tl:#7fe0d4;--w:#f3ecf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--a);color:var(--w);font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

#lock.out{opacity:0;filter:blur(22px);pointer-events:none}
#lock h1{font-weight:300;font-size:clamp(28px,6vw,52px);margin:18px 0 8px;text-shadow:0 0 40px var(--d)}
#lock p{font-family:Inter,sans-serif;font-weight:300;font-size:14px;opacity:.7;margin:0 0 26px}
#lock svg{width:38px;opacity:.85;filter:drop-shadow(0 0 10px var(--e))}
#pw{background:#ffffff0d;border:1px solid #a979c755;color:var(--w);padding:14px 18px;border-radius:30px;width:min(300px,80vw);text-align:center;font:16px Inter,sans-serif;outline:none;backdrop-filter:blur(8px)}
#pw:focus{border-color:var(--e);box-shadow:0 0 24px #6d3b8f88}
.btn{margin-top:16px;background:linear-gradient(135deg,var(--d),var(--c));border:1px solid #a979c766;color:var(--w);padding:13px 30px;border-radius:30px;font:400 14px Inter,sans-serif;letter-spacing:.08em;cursor:pointer;transition:.4s}
.btn:hover{box-shadow:0 0 28px #a979c788}
#err{height:24px;margin-top:14px;font:italic 19px "Cormorant Garamond",serif;color:var(--e);opacity:0;transition:.5s}#err.on{opacity:1}
#lock.shake #pw{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#black{position:fixed;inset:0;background:#000;z-index:60;opacity:0;pointer-events:none;transition:opacity 1s}#black.on{opacity:1}
#story{display:none;position:relative;z-index:2;opacity:0;transition:opacity 2s}#story.show{opacity:1}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16vh 8vw 12vh;position:relative;gap:4.2vh}
section>*{max-width:640px;width:100%}
.s-blk{background:#000}.s-eye{background:radial-gradient(ellipse at 50% 30%,#321650aa,#050208 65%)}
.s-p1{background:linear-gradient(#120A1F,#1D1030 50%,#120A1F)}.s-p2{background:radial-gradient(ellipse at 20% 80%,#321650,#120A1F 70%)}.s-ring{background:radial-gradient(ellipse at 50% 20%,#2a1245,#000 60%)}
.p,.h,.big,.tw,.sm{margin:0;opacity:0;filter:blur(6px);transform:translateY(16px);transition:opacity 2s,filter 2s,transform 2s}
.p{font-size:clamp(20px,4.6vw,27px);line-height:1.55;font-weight:400}.h{font-size:clamp(30px,7vw,50px);font-weight:300;text-shadow:0 0 40px var(--d);line-height:1.2}
.big{font-size:clamp(38px,10vw,74px);font-weight:300;line-height:1.1;text-shadow:0 0 50px var(--d),0 0 20px #a979c744}
.tw{font-size:clamp(20px,4.6vw,27px);font-style:italic;line-height:1.55}.sm{font:300 13px Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
.gap{height:10vh}.in.p,.in.h,.in.tw,.in.sm,.in.big{opacity:1;filter:none;transform:none}.in.sm{opacity:.65}
.big span,.tw span{opacity:0;display:inline-block;filter:blur(8px);transition:opacity 1.2s,filter 1.2s;transition-delay:calc(var(--i)*380ms)}
.tw span{transition-delay:calc(var(--i)*30ms);transition-duration:.3s;display:inline}
.in span{opacity:1!important;filter:none!important}
.big span{margin:0 .12em}
.cont{opacity:0;transition:opacity 2s 1s;margin-top:4vh}.cont.in{opacity:.8}.cont .btn{background:none;margin:0}
#pg{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;font:300 11px Inter,sans-serif;letter-spacing:.15em;writing-mode:vertical-rl;opacity:.55;display:none}
#mus{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;background:#ffffff12;border:1px solid #a979c755;color:var(--w);border-radius:20px;padding:8px 14px;font:300 12px Inter,sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
.ph{margin:0 auto;position:relative;overflow:hidden;border-radius:14px;width:min(320px,74vw);aspect-ratio:3/4;box-shadow:0 0 60px #6d3b8f66;transform:translateY(var(--py,0px));background:linear-gradient(160deg,var(--c),var(--a));opacity:0;transition:opacity 3s}.ph.in{opacity:1}
.ph img{width:100%;height:100%;object-fit:cover;display:block;animation:zm 26s ease-in-out infinite alternate}
@keyframes zm{to{transform:scale(1.12)}}.ph.miss img{display:none}.ph.miss::before{content:"♥";position:absolute;inset:0;display:grid;place-items:center;font-size:60px;color:#a979c744}
.spot::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,transparent 14%,#120A1Fe6 62%)}
.duo{display:flex;gap:14px;justify-content:center}.duo .ph{width:44%;max-width:230px}.baby{width:min(250px,64vw);aspect-ratio:1}
.eye{width:min(260px,70vw);margin:0 auto;filter:drop-shadow(0 0 22px #a979c7);animation:bl 7s infinite}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.rw{margin:2vh auto;width:190px;height:190px;perspective:700px;display:grid;place-items:center}
.rw>*{animation:sp 10s linear infinite;transform-style:preserve-3d}.rw{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));animation:hb 3s ease-in-out infinite;border-radius:50%}
@keyframes sp{to{transform:rotateY(360deg)}}@keyframes hb{50%{box-shadow:0 0 90px 20px #a979c744}0%,100%{box-shadow:0 0 50px 8px #6d3b8f44}}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(#f6e7b0,#a8842f,#fff3c4,#8a6a22,#f6e7b0);-webkit-mask:radial-gradient(circle,transparent 56%,#000 58%);mask:radial-gradient(circle,transparent 56%,#000 58%);position:relative}
.rimg{width:170px;mix-blend-mode:screen;border-radius:50%}
.phone{width:210px;margin:0 auto;border:1px solid #a979c755;border-radius:26px;padding:16px;background:#ffffff0a;backdrop-filter:blur(8px);position:relative}
.phone div{border-radius:14px;padding:10px;margin:8px 0;font:300 13px Inter,sans-serif}.pt{background:#ffffff10}.pb{background:#6d3b8f66;text-align:right}
.bl{background:#3b0d1d;color:#ff9db1;text-align:center;letter-spacing:.2em;text-transform:uppercase;animation:pl 2.4s infinite}@keyframes pl{50%{opacity:.4}}
.fq{position:absolute;font-style:italic;font-size:18px;color:var(--e);opacity:0;animation:fl 10s infinite}@keyframes fl{0%{opacity:0;transform:translateY(20px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-90px)}}
.qw{min-height:20vh;display:grid;place-items:center}.qq{font-size:clamp(26px,6vw,40px);font-style:italic;opacity:0;transition:opacity 1.2s;text-shadow:0 0 30px var(--d)}.qq.on{opacity:1}
.sil{height:130px;position:relative;margin:0 auto}.sil i{position:absolute;bottom:0;width:30px;height:100px;background:linear-gradient(#050208,#1a0b2b);border-radius:50% 50% 6px 6px/25% 25% 6px 6px;box-shadow:0 0 30px #6d3b8f88;animation:wk 11s ease-in-out infinite alternate}
.sil i::before{content:"";position:absolute;top:-22px;left:3px;width:24px;height:24px;border-radius:50%;background:#0e0618}.sil i.b{animation-direction:alternate-reverse;right:0}.sil i.a{left:0}
@keyframes wk{from{transform:translateX(0)}to{transform:translateX(calc(min(600px,84vw)/2 - 40px))}}.sil i.b{animation-name:wk2}@keyframes wk2{from{transform:translateX(0)}to{transform:translateX(calc(-1*(min(600px,84vw)/2 - 40px)))}}
.more{font:300 13px Inter,sans-serif;opacity:.35;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.more:hover{opacity:.8}
.hid{font-size:24px;font-style:italic;opacity:0;height:0;transition:opacity 2s}.hid.on{opacity:1;height:auto}

#fx{z-index:55}
#lock{background:radial-gradient(ellipse at 15% 20%,#ff8fb844,transparent 45%),radial-gradient(ellipse at 85% 80%,#7fe0d433,transparent 45%),radial-gradient(ellipse at 50% 40%,#321650,#120A1F 75%)}
#lock h1{color:#ffe3f1;text-shadow:0 0 40px #ff8fb8aa}
.em{font-size:26px;letter-spacing:.4em;animation:fl2 3s ease-in-out infinite}
@keyframes fl2{50%{transform:translateY(-8px)}}
.btn{background:linear-gradient(135deg,#ff7fae,#a06bd0);border-color:#ffc2dc88;text-shadow:0 1px 6px #0006}
.s-p1{background:radial-gradient(ellipse at 15% 20%,#ff8fb833,transparent 50%),radial-gradient(ellipse at 85% 75%,#7fe0d422,transparent 50%),linear-gradient(#120A1F,#1D1030 50%,#120A1F)}
.s-p2{background:radial-gradient(ellipse at 80% 15%,#ffb38a33,transparent 50%),radial-gradient(ellipse at 10% 85%,#a979c744,transparent 55%),#160a24}
.h,.big,.h span,.big span{color:var(--hc,#ffe3f1)}
section:nth-child(5n+1){--hc:#ffd1e6}section:nth-child(5n+2){--hc:#ffdcc2}section:nth-child(5n+3){--hc:#c9f5ee}section:nth-child(5n+4){--hc:#fff0b8}section:nth-child(5n){--hc:#e9d5ff}
.p{color:#f8eff9}
section::before{content:attr(data-e);position:absolute;top:5vh;left:50%;transform:translateX(-50%);font-size:38px;letter-spacing:.3em;white-space:nowrap;animation:fl2 4s ease-in-out infinite}
.ph{border:5px solid #fff;box-shadow:0 10px 50px #ff8fb855,0 0 60px #a979c766}
.duo .ph:first-child{rotate:-3deg}.duo .ph:last-child{rotate:3deg}
.st{position:absolute;right:6px;top:4px;font-size:28px;z-index:3;animation:fl2 3s ease-in-out infinite}
.avt{position:absolute;inset:0;width:100%;height:100%;display:none}.miss .avt{display:block}.ph.miss::before{content:none}
.dream{place-items:center;text-align:center;font-size:52px;line-height:1.3;background:radial-gradient(circle,#ffb38a66,#321650)}.miss .dream{display:grid}
.baby{border-radius:50%}
.rw{position:relative}.rw::before,.rw::after{content:"✨";position:absolute;font-size:24px;animation:tw2 2s infinite}.rw::before{top:-4px;left:6px}.rw::after{bottom:0;right:4px;animation-delay:1s}@keyframes tw2{50%{opacity:.2;transform:scale(.6)}}
#fx{pointer-events:none!important}#pw{position:relative;z-index:2;-webkit-user-select:text;user-select:text}
</style></head><body>
<canvas id="fx"></canvas><div id="black"></div>
<div id="lock"><svg viewBox="0 0 24 24" fill="none" stroke="#e9d5ff" stroke-width="1.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
<div class="em">🌙💜🦋</div><h1>Some memories are not meant for everyone.</h1><p>If you know the key, enter it.</p>
<input id="pw" type="text" inputmode="text" autocorrect="off" placeholder="Enter password" autocomplete="off" autocapitalize="none" spellcheck="false"><div id="err"></div>
<button class="btn" id="go">💌 Open the memory</button></div>
<div id="pg"></div><button id="mus" style="display:none">🎵 Yaadein · off</button><main id="story"></main>
<script>
const HX="d0e9c64094054d54263ecc00112a71368d1145a39cbcf26a3f44b0817f688c48",DJ=3777588330;
const IMG={my:"",her:"",baby:"",ring:""},FILE={my:"my-photo.jpg",her:"her-photo.jpg",baby:"future-baby.jpg",ring:"ring.jpg"};
const $=s=>document.querySelector(s);
async function ok(v){v=v.trim().toLowerCase().replace(/\s+/g,"");try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")===HX}catch(e){let h=5381;for(const c of v)h=((h*33)^c.charCodeAt(0))>>>0;return h===DJ}}
async function tryOpen(){const e=$("#err");if(await ok($("#pw").value)){$("#pw").value="";e.classList.remove("on");unlock()}else{e.textContent="This memory has its own little key.";e.classList.add("on");$("#lock").classList.remove("shake");void $("#lock").offsetWidth;$("#lock").classList.add("shake")}}
$("#go").onclick=tryOpen;$("#pw").addEventListener("keydown",e=>{if(e.key=="Enter")tryOpen()});
function unlock(){$("#lock").classList.add("out");au.play().then(()=>{on=1;$("#mus").textContent="🎶 Yaadein · on"}).catch(()=>{pad();on=1;$("#mus").textContent="🎶 Yaadein · on"});$("#black").classList.add("on");setTimeout(()=>{$("#lock").remove();build();$("#story").style.display="block";$("#pg").style.display="block";$("#mus").style.display="block";scrollTo(0,0);requestAnimationFrame(()=>{$("#story").classList.add("show");$("#black").classList.remove("on")})},1700)}
const AV={her:'<svg class="avt" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2dc"/><stop offset="1" stop-color="#b79cf0"/></linearGradient></defs><rect width="120" height="160" fill="url(#gb)"/><path d="M28 150C22 90 26 40 60 36C94 40 98 90 92 150Z" fill="#2b1620"/><path d="M20 160C22 128 42 118 60 118C78 118 98 128 100 160Z" fill="#c9a7ff"/><path d="M48 118L60 134L72 118Z" fill="#fff"/><rect x="53" y="98" width="14" height="22" fill="#f1c19b"/><ellipse cx="60" cy="76" rx="24" ry="28" fill="#f7cfae"/><path d="M35 72C36 46 84 46 85 72C76 60 56 56 35 72Z" fill="#2b1620"/><ellipse cx="50" cy="78" rx="2.6" ry="3.4" fill="#2b1620"/><ellipse cx="70" cy="78" rx="2.6" ry="3.4" fill="#2b1620"/><circle cx="45" cy="88" r="4" fill="#ff9db8" opacity=".55"/><circle cx="75" cy="88" r="4" fill="#ff9db8" opacity=".55"/><path d="M53 93Q60 99 67 93" stroke="#b5495f" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="65" cy="89.5" r="1.1" fill="#4a2a20"/><path d="M84 50l2.5 5 5.5 .8-4 4 1 5.5-5-2.6-5 2.6 1-5.5-4-4 5.5-.8z" fill="#ffd98a"/><path d="M60 146c-4-4-8-8-4-11 2-2 4-1 4 1 0-2 2-3 4-1 4 3 0 7-4 11z" fill="#ff7fae"/></svg>',my:'<svg class="avt" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be7dc"/><stop offset="1" stop-color="#ffd0a8"/></linearGradient></defs><rect width="120" height="160" fill="url(#bb)"/><path d="M14 160C16 126 38 116 60 116C82 116 104 126 106 160Z" fill="#26355d"/><path d="M46 116L60 140L74 116Z" fill="#fff"/><path d="M46 116L56 138L38 130Z M74 116L64 138L82 130Z" fill="#1b2645"/><rect x="53" y="98" width="14" height="20" fill="#e8b58f"/><ellipse cx="60" cy="76" rx="23" ry="27" fill="#f0c39c"/><path d="M36 66C40 34 84 34 84 64C74 50 50 48 36 66Z" fill="#1d1420"/><circle cx="50" cy="78" r="7" fill="none" stroke="#2b1a35" stroke-width="1.6"/><circle cx="70" cy="78" r="7" fill="none" stroke="#2b1a35" stroke-width="1.6"/><path d="M57 78h6" stroke="#2b1a35" stroke-width="1.6"/><circle cx="50" cy="78" r="1.8" fill="#2b1a35"/><circle cx="70" cy="78" r="1.8" fill="#2b1a35"/><path d="M52 92Q60 99 68 92" stroke="#a5453f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',baby:'<div class="avt dream">🏡<br>👶✨</div>'},STK=["🌸","🦋","✨","💜","🎀","🌷"];
const ph=(k,c="")=>`<figure class="ph ${c}"><img loading="lazy" alt="" src="${IMG[k]||FILE[k]}" onerror="this.parentNode.classList.add('miss')">${AV[k]}<b class="st">${STK[(Math.random()*6)|0]}</b></figure>`;
const W={her:()=>ph("her"),spot:()=>ph("her","spot"),duo:()=>`<div class="duo">${ph("my")}${ph("her")}</div>`,baby:()=>ph("baby","baby"),
ring:()=>`<div class="rw"><img class="rimg" alt="" src="${IMG.ring||FILE.ring}" onerror="this.outerHTML='<div class=ring></div>'"></div>`,
eye:()=>`<svg class="eye" viewBox="0 0 200 90"><defs><radialGradient id="ir"><stop offset="0" stop-color="#e9d5ff"/><stop offset=".45" stop-color="#a979c7"/><stop offset="1" stop-color="#321650"/></radialGradient></defs><path d="M5 45Q100-15 195 45Q100 105 5 45Z" fill="#00000088" stroke="#a979c7" stroke-opacity=".5"/><circle cx="100" cy="45" r="26" fill="url(#ir)"/><circle cx="100" cy="45" r="10" fill="#0a0512"/><circle cx="108" cy="37" r="4" fill="#fff" opacity=".8"/></svg>`,
phone:()=>`<div class="phone"><div class="pt">Messages</div><div class="pb">Hey…</div><div class="bl">Blocked</div><span class="fq" style="left:-10px;top:40%">Why?</span><span class="fq" style="right:-20px;top:55%;animation-delay:2.5s">What happened?</span><span class="fq" style="left:0;top:80%;animation-delay:5s">Was any of it real?</span><span class="fq" style="right:0;top:30%;animation-delay:7.5s">Did I misunderstand everything?</span></div>`,
q:()=>`<div class="qw"><div class="qq" data-q></div></div>`,sil:()=>`<div class="sil"><i class="a"></i><i class="b"></i></div>`,
more:()=>`<div><span class="more" onclick="this.nextSibling.classList.toggle('on')">There's one more thing...</span><p class="hid">I never wanted perfection.<br>I only wanted honesty.</p></div>`,
replay:()=>`<button class="btn" onclick="replay()">Replay the memory</button>`};
const Q=["Why did you lie?","Why did you let me believe those things?","Why did you block me?","Why didn't you explain?","Which memories were real?","Did you ever take the things we planned seriously?","Did that ring ever mean what it meant to me?"];
const S=[
["s-blk",[".30 September","13 days before your birthday.","I know you'll probably be in Kallar Kahar when that day comes...","So I decided not to wait.","!Happy Birthday, in advance. 🎂","@her",".13 October 🎂",".Your day.","And this is my little message before it arrives."]],
["s-p1",["#This isn't just a birthday wish.","I could have simply sent you a normal birthday message.|Happy Birthday.|Stay happy.|Take care.","And that's it.","But somehow that didn't feel enough.","Because you weren't just a random person whose birthday I happened to remember.","There was a time when you became someone I genuinely cared about.","And when someone becomes important to you, even ordinary dates start carrying memories.","Maybe this website will make you smile.|Maybe it'll make you uncomfortable.|Maybe you'll read everything and close it without saying anything.","I don't know.","I just know I wanted to say these things once, properly."]],
["s-eye",["@eye","#Maybe someday, if you get the chance...","!Look into my eyes.","Don't ask me what happened.|Just look.","Maybe you'll understand something that words never managed to explain.","Maybe you'll see how much pain was hidden behind the normal face I showed everyone.","I don't know whether you ever noticed it.|But there was a lot behind those eyes.","Things I didn't say.|Questions I never got answers to.|Things I heard and couldn't understand.|Memories I tried to ignore.|And a trust that didn't break all at once...","^It broke piece by piece."]],
["s-p2",["#There are little things the mind remembers.","@spot","Even after everything, there are little details my mind still remembers.","That small beautiful mole just above your lip...","It's strange how the mind remembers something so small when it has so many bigger things to forget.","Maybe that's what memories do.","They don't always keep the things we want.|Sometimes they keep the smallest details."]],
["s-p1",["#Some mistakes don't simply disappear.","Some mistakes are small enough to forgive quickly.","And then there are some mistakes that leave a wound inside the heart.","You may move on.|You may stop talking about them.|You may even smile normally again.","But somewhere inside, the memory remains.","What happened between us left questions in my mind that I still don't completely understand.","I was hurt.","Not only because of what happened,|but because of the trust I had placed in you.","You used to say certain things and I would believe them with my eyes closed.","That's how much I trusted what came from you."]],
["s-blk",["@phone","#I still don't understand the block.","You blocked me almost everywhere.|And honestly, that hurt more than I expected.","I kept asking myself why.","What had I done that made blocking me the answer?|Why was it necessary?|Why did everything have to end with silence instead of an explanation?","I know the phone was yours.|Your decisions were yours.|And I respect that.","But that doesn't mean it didn't hurt.","Because when someone you once trusted suddenly disappears behind a block, the silence leaves behind a lot of questions."]],
["s-p2",["#Some things reached me that I never wanted to hear.","There were things I heard after meeting Ahmad.|Things I had never expected to hear.","And honestly, I don't know how I managed to take all of it in.","I had believed so many things you told me.","You could say something,|and I would accept it.","Not because I was forced to.|Because I trusted you.","After hearing those things, my mind felt completely overwhelmed.","It was difficult to understand which memories were real, which words were true, and which things I had simply believed because I wanted to trust you.","I won't pretend that it didn't change something inside me.","It made me much more careful about trust.","For a while, it made me feel like trusting anyone again would be difficult."]],
["s-ring",["@ring","!THE RING",".The one thing I hope you still have.","I gave you that ring with a heart full of meaning.","Maybe to you it was only a ring.|Maybe it became just another thing.|Maybe today it means nothing.","I don't know.","But when I gave it to you, I wasn't joking.","!I meant it.","Every time I think about that ring, I remember the person I was when I gave it to you.","Someone who trusted.|Someone who believed.|Someone who genuinely cared.","I don't know whether you still wear it.|And I don't know whether you ever will again.","_","But if life ever gives us a chance to see each other again...","!I think I'll look at your hand first.","Not your clothes.|Not your phone.|Not anything else.","_","^Just the ring.","To see whether you still wear it.","I hope you never take it off.","Not because I have the right to tell you what to do.|You don't owe me that.","But because I gave it to you with a heart that was completely genuine.","Whatever that ring means to you today,|I'll always know what it meant to me when I gave it to you."]],
["s-p1",["#We even planned a future that never happened.","@duo","Remember those conversations?|The random future plans.|The things we talked about when everything seemed possible.|Even the silly conversations about having three children someday.","Maybe those conversations were jokes for you.|Maybe you didn't take them seriously.|Maybe you said them casually and forgot them later.","But I didn't.","!I took some of those dreams seriously.","When I cared about you, I didn't know how to care halfway.","I could actually imagine a future from those conversations.|Maybe that's why losing the relationship also meant losing a future I had quietly imagined in my head.","@baby",".A future we once imagined.","Not something that happened.|Just something we once talked about.","Some dreams are never supposed to become real.|Sometimes they remain photographs inside our memories."]],
["s-p2",["#You were the first person I genuinely liked like that.","You were the first girl who genuinely felt different to me.","I wasn't pretending.|I wasn't trying to impress you.|I genuinely liked you.","I trusted your words.|You could tell me something and I would believe it without needing a hundred explanations.","Maybe that was my mistake.|Maybe trusting someone with your whole heart is always a little risky.","But I don't regret that I cared genuinely.|I'd rather know that my feelings were real than pretend they weren't.","The painful part was realizing that genuine feelings don't guarantee genuine loyalty from the other person."]],
["s-blk",["#One thing I hope you learn from all of this.","Please don't ever give another person dreams you don't mean.","Don't make promises you don't intend to keep.|Don't make someone build a future in their mind if you already know you don't see that future.","Because some words disappear the moment they're spoken.|But some words stay inside another person's mind for years.","Sometimes a person hears something from you and builds an entire little future around it.|And when that future disappears,|they don't just lose you.|They lose something they had imagined.","I pray Allah protects you from ever becoming the reason someone carries that kind of pain.","And I pray Allah also gives you people who are honest with you, so you never have to question whether someone's words are real."]],
["s-p1",["#Wherever life takes you...","You're going to Kallar Kahar around your birthday.|I hope you enjoy your trip 🌿|I hope you make beautiful memories 📸","And more than anything, take care of yourself.","You've entered a new section now.|There will be new people around you.|People you've known for a long time and people you are still getting to know.","There are people around you who have been around since earlier semesters too.","I'm not saying this to control you.|I'm not saying it because I own any part of your life.|I don't.","I'm saying it only because, despite everything between us, I still want you to protect your dignity, your peace and yourself.","Be careful about who you trust.|Know the intentions of the people around you.|And don't let anyone convince you to become someone you aren't.","Respect yourself.|And if possible, respect the memories we once shared too."]],
["s-eye",["#The questions that never got answered","@q","^Maybe I'll never get all the answers.","And maybe one day I won't need them anymore."]],
["s-p2",["@sil","#If someday, somewhere, we meet again...","I don't know what we'll say.|Maybe nothing.|Maybe just a simple hello.|Maybe we'll pretend we never knew each other.|Maybe we'll remember everything.","But if you ever get the chance to look into my eyes...","!Look properly.","Maybe you'll understand how much I had kept inside.","And maybe, without asking anything...|just look at your hand.","@ring","That's probably the first thing I'll notice."]],
["s-p1",["@her","#Before your birthday arrives...","I don't want the final words here to be angry.","Whatever happened between us happened.","The lies hurt.|The broken trust hurt.|The block hurt.|The unanswered questions hurt.","But I don't want your birthday to become a list of everything that went wrong.","I hope you are happy 🌸|I hope you stay safe 🤍|I hope you grow 🌱|I hope you find people who are honest with you.|I hope you never have to question whether someone genuinely cares about you.","!Happy Birthday in advance. 🎂","Enjoy Kallar Kahar 🦚🌿|Make good memories 📸|Take care of yourself 💜",".13 October 🎂"]],
["s-ring",["@ring","Some things are given as gifts.","_","Some things are given with a piece of the heart.","That ring was one of those things for me.","I hope that if I ever see you again...","^I'll see it on your hand.","_","_","Some people leave your life.","_","Some memories don't.","_","!Happy Birthday, in advance. 🎂","13 October ❤️","@more","@replay"]]];
